<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>跳石過河</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="game-page">
  <!-- Shared icon / gem shapes -->
  <svg class="svg-sprite" aria-hidden="true" focusable="false">
    <symbol id="gem" viewBox="-12 -13 24 24">
      <path d="M0 -8.5 L10 -1.2 L6.2 10.5 L-6.2 10.5 L-10 -1.2 Z" fill="#2b1608" fill-opacity=".35" />
      <path d="M0 -10.5 L10 -3.2 L6.2 8.5 L-6.2 8.5 L-10 -3.2 Z" stroke="#fff" stroke-width="3.4" stroke-linejoin="round" />
      <path d="M0 -10.5 L10 -3.2 L6.2 8.5 L-6.2 8.5 L-10 -3.2 Z" stroke="rgba(0,0,0,.4)" stroke-width="1.1" stroke-linejoin="round" />
      <path d="M0 -10.5 L10 -3.2 L0 -0.5 Z" fill="#fff" fill-opacity=".55" />
      <path d="M0 -10.5 L-10 -3.2 L0 -0.5 Z" fill="#fff" fill-opacity=".25" />
      <path d="M0 -0.5 L6.2 8.5 L-6.2 8.5 Z" fill="#000" fill-opacity=".12" />
    </symbol>
    <symbol id="icon-tick" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10.5" fill="#2f9e44" stroke="#fff" stroke-width="2.5" />
      <path d="M7 12.5l3.2 3.2L17 8.6" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="icon-cross" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10.5" fill="#e03131" stroke="#fff" stroke-width="2.5" />
      <path d="M8.2 8.2l7.6 7.6M15.8 8.2l-7.6 7.6" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" />
    </symbol>
    <symbol id="icon-back" viewBox="0 0 24 24">
      <path d="M14.5 5L7.5 12l7 7" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="icon-play" viewBox="0 0 24 24">
      <path d="M8 4.8v14.4a1 1 0 0 0 1.5.86l11.2-7.2a1 1 0 0 0 0-1.72L9.5 3.94A1 1 0 0 0 8 4.8z" fill="currentColor" />
    </symbol>
    <symbol id="icon-speaker" viewBox="0 0 24 24">
      <path d="M3.5 9.2h3.8L12.5 5v14l-5.2-4.2H3.5z" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
      <path d="M15.6 9a4.2 4.2 0 0 1 0 6M18.2 6.4a8 8 0 0 1 0 11.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
    </symbol>
    <symbol id="icon-replay" viewBox="0 0 24 24">
      <path d="M5.6 9.5A7 7 0 1 1 5 13.4" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" />
      <path d="M4.2 4.6v5.4h5.4" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="icon-list" viewBox="0 0 24 24">
      <g fill="currentColor"><circle cx="5" cy="6.5" r="1.9" /><circle cx="5" cy="12" r="1.9" /><circle cx="5" cy="17.5" r="1.9" /></g>
      <path d="M9.5 6.5H20M9.5 12H20M9.5 17.5H20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" />
    </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24">
      <path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" />
    </symbol>
    <symbol id="icon-spark" viewBox="0 0 24 24">
      <path d="M12 1l2.3 8.7L23 12l-8.7 2.3L12 23l-2.3-8.7L1 12l8.7-2.3z" />
    </symbol>
    <symbol id="icon-rotate" viewBox="0 0 24 24">
      <rect x="3" y="7.5" width="18" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2.2" />
      <path d="M8 3.6a9 9 0 0 1 9.4 1.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      <path d="M17.8 2.4v3.2h-3.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
  </svg>

  <div class="viewport">
    <main id="stage" class="stage">
      <img class="scene-bg" src="./Image/GameBackground.png" alt="" draggable="false" />
      <div id="water" class="water" aria-hidden="true">
        <div class="water-sheen"></div>
      </div>

      <!-- Stones and the bear; stones are added by game.js -->
      <div id="world" class="world">
        <div id="bear" class="bear" aria-hidden="true">
          <div class="bear-body">
            <img class="bear-img" src="./Image/WatermelonBear.png" alt="" draggable="false" />
          </div>
        </div>
      </div>

      <div id="monster" class="monster" aria-hidden="true">
        <div class="monster-float">
          <img class="monster-img" src="./Image/NumberMonster.png" alt="" draggable="false" />
        </div>
      </div>

      <div id="fx" class="fx" aria-hidden="true"></div>

      <div id="speech" class="speech" hidden>
        <button id="speaker-btn" class="speaker-btn" type="button" aria-label="再聽一次">
          <svg aria-hidden="true"><use href="#icon-speaker" /></svg>
        </button>
        <p id="speech-text" class="speech-text" aria-live="polite"></p>
        <svg class="speech-tail" viewBox="0 0 36 36" aria-hidden="true">
          <path class="speech-tail-fill" d="M0 4H12V10H22V16H32V20H22V26H12V32H0Z" />
          <path class="speech-tail-line" d="M0 4H12V10H22V16H32V20H22V26H12V32H0" />
        </svg>
      </div>

      <a class="back-link" href="./index.html" aria-label="返回選單">
        <svg aria-hidden="true"><use href="#icon-back" /></svg>
      </a>
      <ol id="steps" class="steps" aria-label="進度"></ol>

      <button id="go-btn" class="go-btn" type="button" hidden>
        <svg class="play-icon" aria-hidden="true"><use href="#icon-play" /></svg>
        <span>開始</span>
      </button>

      <div id="confetti" class="confetti" aria-hidden="true"></div>

      <section id="results" class="overlay" hidden>
        <div class="panel-card results-card" role="dialog" aria-labelledby="results-title">
          <h2 id="results-title" class="results-title">成功過河！</h2>
          <div id="results-gems" class="results-gems" aria-label="收集到的能量寶石"></div>
          <p class="results-score">答對 <b id="score">0</b> / <span id="score-total">8</span> 題</p>
          <div class="results-actions">
            <button id="details-btn" class="btn btn-blue" type="button">
              <svg aria-hidden="true"><use href="#icon-list" /></svg><span>查看詳情</span>
            </button>
            <a id="replay-btn" class="btn btn-green" href="./game.html">
              <svg aria-hidden="true"><use href="#icon-replay" /></svg><span>再玩一次</span>
            </a>
            <a class="btn btn-brown" href="./index.html">
              <svg aria-hidden="true"><use href="#icon-back" /></svg><span>返回選單</span>
            </a>
          </div>
        </div>
      </section>

      <section id="details" class="overlay overlay-top" hidden>
        <div class="panel-card details-card" role="dialog" aria-labelledby="details-title">
          <header class="details-head">
            <h2 id="details-title" class="details-title">答題詳情</h2>
            <button id="details-close" class="icon-btn" type="button" aria-label="關閉">
              <svg aria-hidden="true"><use href="#icon-close" /></svg>
            </button>
          </header>
          <div class="table-wrap">
            <table class="details-table">
              <thead>
                <tr>
                  <th scope="col">題</th>
                  <th scope="col">題目</th>
                  <th scope="col">紅色石頭</th>
                  <th scope="col">藍色石頭</th>
                  <th scope="col">正確答案</th>
                  <th scope="col">第一次選擇</th>
                  <th scope="col">嘗試次數</th>
                  <th scope="col">第一次答對</th>
                </tr>
              </thead>
              <tbody id="details-body"></tbody>
            </table>
          </div>
        </div>
      </section>

      <div id="loading" class="overlay loading">
        <div class="loading-box">
          <span>載入中</span>
          <div class="loading-bar"><i id="loading-fill"></i></div>
        </div>
      </div>
    </main>
  </div>

  <p class="rotate-hint">
    <svg aria-hidden="true"><use href="#icon-rotate" /></svg>
    <span>橫向放置效果更佳</span>
  </p>

  <noscript><p class="noscript">請開啟 JavaScript 才可以進行遊戲。</p></noscript>

  <script src="./game.js"></script>
</body>
</html>
